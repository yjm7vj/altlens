# Render blueprint for the AltLens backend.
#
# The API serves the illustrative demo dataset from memory, so the database
# below is optional: drop the databases block and the ALTLENS_DATABASE_URL
# entry to deploy the demo with no Postgres instance at all.

services:
  - type: web
    name: altlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn altlens.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALTLENS_CORS_ORIGINS
        sync: false
      - key: ALTLENS_MODEL_PROVIDER
        value: rule_based
      - key: OPENAI_API_KEY
        sync: false
      - key: ALTLENS_DATABASE_URL
        fromDatabase:
          name: altlens-db
          property: connectionString

databases:
  - name: altlens-db
    plan: free
